name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run lint checks (ruff)
        run: |
          ruff check .

      - name: Validate YAML configurations
        run: |
          python -c "
          import glob, yaml
          patterns = ['configs/*.yml', 'configs/*.yaml', 'docker/*.yml', 'docker/*.yaml', '.github/workflows/*.yml']
          for p in patterns:
              for f in glob.glob(p):
                  with open(f, 'r', encoding='utf-8') as stream:
                      yaml.safe_load(stream)
                  print(f'Valid YAML: {f}')
          "

      - name: Validate CITATION.cff syntax
        run: |
          python -c "
          import yaml
          with open('CITATION.cff', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          assert data.get('cff-version') == '1.2.0', 'Invalid cff-version'
          assert data.get('title') == 'Frigate VMS Lab', 'Invalid title'
          assert 'authors' in data, 'Missing authors'
          print('Valid CITATION.cff')
          "

      - name: Run unit and integration tests
        run: |
          pytest -v

      - name: Run config safety & privacy enforcement
        run: |
          pytest tests/test_config_safety.py -v
