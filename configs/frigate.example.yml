# ==============================================================================
# Frigate VMS Lab - Baseline Single-Camera Configuration
# Experiment: EXP-001 (Baseline Single-Camera Resource Profile)
# ==============================================================================
# Upstream Software: Frigate (https://github.com/blakeblackshear/frigate)
#
# Placeholder Convention:
# - Host: CAMERA_1_HOST
# - Credentials: CAMERA_USERNAME and {FRIGATE_RTSP_PASSWORD}
# - Paths: STREAM_PATH_SUB (detect), STREAM_PATH_MAIN (record)
#
# NOTE: Inside Frigate YAML, use {FRIGATE_VARIABLE} for credential substitution.
# Do NOT use ${VARIABLE} syntax here (that is for Docker Compose).
# ==============================================================================

mqtt:
  enabled: false # Disabled for baseline isolation unless explicitly testing MQTT

# Integrated go2rtc configuration
# Camera connects once to go2rtc; Frigate consumers tap into local restream
go2rtc:
  streams:
    camera_1_sub:
      - rtsp://CAMERA_USERNAME:{FRIGATE_RTSP_PASSWORD}@CAMERA_1_HOST/STREAM_PATH_SUB
    camera_1_main:
      - rtsp://CAMERA_USERNAME:{FRIGATE_RTSP_PASSWORD}@CAMERA_1_HOST/STREAM_PATH_MAIN

cameras:
  camera_1:
    ffmpeg:
      inputs:
        # Substream dedicated to low-resolution motion detection & inference
        - path: rtsp://127.0.0.1:8554/camera_1_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        # Mainstream dedicated to high-resolution full-quality recording
        - path: rtsp://127.0.0.1:8554/camera_1_main
          input_args: preset-rtsp-restream
          roles:
            - record

    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5

    record:
      enabled: true
      retain:
        days: 3
        mode: all

    snapshots:
      enabled: false

# Default CPU detector for baseline measurement
detectors:
  cpu_detector:
    type: cpu
    num_threads: 2

version: 0.14
